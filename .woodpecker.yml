when:
  - event:
      - push
      - pull_request
      - manual
      - cron

clone:
  git:
    image: mirror.gcr.io/woodpeckerci/plugin-git:2.6.5@sha256:2b34ecbbfd2f318405bd5d2765a750f6b02dae5dfb8707e16c943b9faeef5fc5
    settings:
      depth: 50
      partial: false

steps:
  locked-omp-contract:
    image: mirror.gcr.io/oven/bun:1.3.14@sha256:e10577f0db68676a7024391c6e5cb4b879ebd17188ab750cf10024a6d700e5c4
    commands:
      - if [ "$CI_PIPELINE_EVENT" = "cron" ]; then git fetch --force --tags https://github.com/usr-bin-roygbiv/omp-cmux.git main && git checkout --detach FETCH_HEAD; fi
      - bun install --frozen-lockfile
      - bun run typecheck
      - bun test
    backend_options:
      kubernetes:
        serviceAccountName: woodpecker-ci-untrusted
        resources:
          requests:
            cpu: "0"
            memory: 256Mi
            ephemeral-storage: 512Mi
          limits:
            cpu: "1"
            memory: 1Gi
            ephemeral-storage: 4Gi

  latest-omp-contract:
    depends_on: [locked-omp-contract]
    image: mirror.gcr.io/oven/bun:1.3.14@sha256:e10577f0db68676a7024391c6e5cb4b879ebd17188ab750cf10024a6d700e5c4
    commands:
      - bun add --dev @oh-my-pi/pi-coding-agent@latest
      - bun run typecheck
      - bun test
    backend_options:
      kubernetes:
        serviceAccountName: woodpecker-ci-untrusted
        resources:
          requests:
            cpu: "0"
            memory: 256Mi
            ephemeral-storage: 512Mi
          limits:
            cpu: "1"
            memory: 1Gi
            ephemeral-storage: 4Gi

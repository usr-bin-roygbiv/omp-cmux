when:
  - event:
      - push
      - pull_request
      - manual
      - cron

clone:
  git:
    image: mirror.gcr.io/woodpeckerci/plugin-git:2.6.5@sha256:2b34ecbbfd2f318405bd5d2765a750f6b02dae5dfb8707e16c943b9faeef5fc5
    settings:
      depth: 50
      partial: false

steps:
  locked-omp-contract:
    image: harbor.tailb18de3.ts.net/linkedin-bot/epyc-omp-workspace@sha256:2afa16d957719844939b2a45bad687e1e3cecf22abe23682e59972a076984e3f
    environment:
      HOME: /tmp
    commands:
      - if [ "$CI_PIPELINE_EVENT" = "cron" ]; then git fetch --force --tags https://github.com/usr-bin-roygbiv/omp-cmux.git main && git checkout --detach FETCH_HEAD; fi
      - bun install --frozen-lockfile
      - bun run typecheck
      - bun test
    backend_options:
      kubernetes:
        serviceAccountName: woodpecker-ci-untrusted
        resources:
          requests:
            cpu: "0"
            memory: 256Mi
            ephemeral-storage: 512Mi
          limits:
            cpu: "1"
            memory: 1Gi
            ephemeral-storage: 4Gi

  latest-omp-contract:
    depends_on: [locked-omp-contract]
    image: harbor.tailb18de3.ts.net/linkedin-bot/epyc-omp-workspace@sha256:2afa16d957719844939b2a45bad687e1e3cecf22abe23682e59972a076984e3f
    environment:
      HOME: /tmp
    commands:
      - bun add --dev --no-save @oh-my-pi/pi-coding-agent@latest
      - bun run typecheck
      - bun test
    backend_options:
      kubernetes:
        serviceAccountName: woodpecker-ci-untrusted
        resources:
          requests:
            cpu: "0"
            memory: 256Mi
            ephemeral-storage: 512Mi
          limits:
            cpu: "1"
            memory: 1Gi
            ephemeral-storage: 4Gi
